<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festive Vector Studio | PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg-main: #0a0406; --bg-panel: #14080c; --bg-header: #050203; --accent-main: #FF0044; --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #331118; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { height: 65px; background-color: var(--bg-header); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
        .workspace { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 350px; background-color: var(--bg-panel); padding: 20px; border-right: 1px solid var(--border-color); overflow-y: auto; }
        .main-canvas { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; padding: 20px; }
        #svg-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #svg-container svg { width: 100%; max-height: 100%; object-fit: contain; }
        .btn { background: #FF0044; color: #fff; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="workspace">
        <aside class="sidebar">
            <button class="btn" onclick="randomizePanels()">SHUFFLE DESIGN</button>
            <button class="btn" style="background:#00E577;" onclick="executeMasterDownload()">DOWNLOAD MASTER SVG</button>
            <div id="accordion-container"></div>
        </aside>
        <main class="main-canvas">
            <div id="svg-container"></div>
        </main>
    </div>

    <script>
        const w=1800, h=2520, gap=40;
        let activePanels = [];
        const types=['xmas_baubles', 'xmas_snowflakes', 'xmas_trees', 'xmas_stars'];
        const palettes = [{bg:'#1a0505', g1:'#FF0044', g2:'#FFB800'}, {bg:'#02120a', g1:'#00FF66', g2:'#00E5FF'}, {bg:'#020a17', g1:'#0077FF', g2:'#FFFFFF'}];

        function randomizePanels(){
            activePanels=[];
            for(let d=0;d<4;d++){
                activePanels.push({type:types[d], p:palettes[d%3], density:10});
            }
            updateView();
        }

        function getPosterElements(panel, idx){
            let p=panel.p, g='';
            if(panel.type === 'xmas_snowflakes') {
                for(let i=0; i<10; i++) {
                    let s = 150, cx = 300 + (i*150), cy = 1200;
                    g += `<g transform="translate(${cx}, ${cy})" stroke="#fff" stroke-width="8" fill="none">`;
                    for(let j=0; j<6; j++){
                        g += `<g transform="rotate(${j*60})">
                                <line x1="0" y1="0" x2="0" y2="-${s}"/>
                                <line x1="0" y1="-${s*0.4}" x2="${s*0.3}" y2="-${s*0.6}"/>
                                <line x1="0" y1="-${s*0.4}" x2="-${s*0.3}" y2="-${s*0.6}"/>
                                <line x1="0" y1="-${s*0.7}" x2="${s*0.2}" y2="-${s*0.9}"/>
                                <line x1="0" y1="-${s*0.7}" x2="-${s*0.2}" y2="-${s*0.9}"/>
                              </g>`;
                    }
                    g += `</g>`;
                }
            } else {
                g += `<rect x="500" y="800" width="800" height="800" fill="${p.g1}"/>`;
            }
            return {pattern: g};
        }

        function buildMasterSVG(){
            let content = '';
            activePanels.forEach((p, i) => {
                let el = getPosterElements(p, i);
                content += `<g transform="translate(${i*(w+gap)},0)"><rect width="${w}" height="${h}" fill="${p.p.bg}"/>${el.pattern}</g>`;
            });
            return `<svg viewBox="0 0 ${(w*4)+(gap*3)} ${h}" xmlns="http://www.w3.org/2000/svg">${content}</svg>`;
        }

        function updateView(){
            document.getElementById('svg-container').innerHTML = buildMasterSVG();
        }

        function executeMasterDownload(){
            const blob = new Blob([buildMasterSVG()],{type:'image/svg+xml'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Design_Pro_${Date.now()}.svg`;
            link.click();
        }

        randomizePanels();
    </script>
</body>
</html>
